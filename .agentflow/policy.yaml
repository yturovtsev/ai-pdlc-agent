# Политика конвейера agentflow: лимиты петель, ACL ролей, операции runner.
# Контроллер читает файл при старте, его sha пишется в manifest запуска.
# Роли не могут менять этот файл: запрет в .qwen/settings.json и в ACL контроллера.
version: 1

qwen:
  # Корпоративный CLI на базе Qwen Code: модели доступны в нём сразу, без авторизации,
  # и переключаются через /model. Имя команды в PATH или абсолютный путь.
  # Переменная окружения AGENTFLOW_QWEN_CLI перекрывает значение.
  # "bundled" — CLI, встроенный в @qwen-code/sdk (корпоративных моделей в нём нет).
  executable: qwen
  # Тип авторизации для --auth-type. Пусто — не передавать: CLI берёт свой преднастроенный.
  # Заполни, только если smoke пишет "No auth type is selected" (например: openai).
  authType: ""
  # Передавать effort из frontmatter роли в сессию: query({ effort }).
  # Если модель или шлюз отвечают ошибкой на поле reasoning — поставь false,
  # модели пойдут на своём уровне по умолчанию.
  effortViaSdk: true
  # Таймаут одного запроса к модели, секунды (QWEN_CODE_API_TIMEOUT_MS сессии). 0 — дефолт CLI (120 с).
  # На effort max ответ модели бывает дольше дефолта: CLI отдаёт «[API Error: Request timeout…]».
  # Не действует, если у модели в провайдере CLI задан свой generationConfig.timeout.
  apiTimeoutSeconds: 600
  # Подробный лог CLI (пишется в events.jsonl через stderr).
  debug: false

openspec:
  # Пусто — схема из openspec/config.yaml репозитория (у kit там agentflow). Непустое значение уходит
  # в `openspec new change --schema` и перебивает схему любого репозитория.
  schema: ""

limits:
  artifactRounds: 3     # раунды исправления одного артефакта
  holisticRounds: 3     # раунды сквозного ревью спеки
  batchRounds: 3        # раунды исправления task batch
  finalFixRounds: 2     # раунды исправлений после финального ревью
  gateAttempts: 3       # попытки гейта на один вызов implementer
  infraRetries: 2       # повторы при инфраструктурных ошибках и битом контракте
  # Лимитов бюджета и времени нет: 0 = без ограничения.
  roleTimeoutMinutes: 0
  # Сторож простоя: столько минут без сообщений от сессии роли — диагноз в логе и диалог
  # «ждать / прервать и повторить шаг / остановить». Должен быть больше qwen.apiTimeoutSeconds,
  # иначе сработает раньше таймаута запроса к модели. 0 — сторож выключен.
  stallMinutes: 15
  # Столько отказов ACL подряд без единого прошедшего вызова — роль упирается в запрет:
  # тот же диалог вмешательства. 0 — проверка выключена.
  aclDenialStreak: 5
  # Обсуждение вопроса с вариантами: после стольких реплик «Обсудить» спрашивает, продолжать
  # или вернуться к выбору (каждая реплика — отдельная сессия роли). 0 — без этого диалога.
  discussTurns: 5

git:
  branchPrefix: agentflow/

# Гейты. ops — операция → shell-команда проекта; выполняется в дереве run (основное дерево или worktree).
# Роли и контроллер вызывают их одинаково: agentflow-gate <операция>.
# Значения ниже — для демо-проекта kit (eslint + node --test через run.sh). Другой репозиторий
# переопределяет их в своём .agentflow/policy.yaml, например:
#   ops: { lint: "npm run lint", unit: "npm test", e2e: "npx playwright test" }
gates:
  ops:
    lint: bash "$AGENTFLOW_KIT/tools/agentflow/run.sh" lint
    unit: bash "$AGENTFLOW_KIT/tools/agentflow/run.sh" unit
    e2e: bash "$AGENTFLOW_KIT/tools/agentflow/run.sh" e2e
  batch: [lint, unit]
  full: [lint, unit, e2e]

# Acceptance-тесты: каталог (в нём же evidence/) и чем их писать — уходит в промпт acceptance-tester.
acceptance:
  dir: e2e
  framework: "node:test и node:assert/strict, файлы e2e/<capability>.test.js; импорт из ../src/index.js"

# Чтение разрешено всем в пределах дерева run. Запись и shell — только перечисленное; в .agentflow-runs/
# не пишет никто. write/denyWrite — glob относительно корня дерева run; {change} — id текущего change,
# {acceptance} — acceptance.dir. shell — операции gates.ops, которые роль может вызвать сама.
# mcp — шаблоны имён MCP-инструментов mcp__<server>__<tool> (* допустим, например "mcp__jira__*").
# Пусто — у роли нет MCP-инструментов вовсе; в шаге только на чтение их нет ни у кого.
# Серверы настраиваются в CLI (.gigacode/settings.json), имя инструмента видно в init-сессии.
roles:
  spec-author:
    write: ["openspec/changes/{change}/**"]
    shell: []
    mcp: []
  spec-reviewer:
    write: []
    shell: []
    mcp: []
  implementer:
    write: ["**"]
    denyWrite:
      - "openspec/**"
      - "{acceptance}/**"
      - ".qwen/**"
      - ".agentflow/**"
      - "tools/**"
      - ".git/**"
      - "node_modules/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - ".gitignore"
    shell: [lint, unit]
    mcp: []
  code-reviewer:
    write: []
    shell: []
    mcp: []
  acceptance-tester:
    write: ["{acceptance}/**"]
    shell: [e2e]
    mcp: []

# Запрещено всем ролям в любой фазе. Уходит в excludeTools каждой сессии
# поверх deny из .qwen/settings.json.
denyAll:
  - "Edit(.qwen/**)"
  - "Edit(.agentflow/**)"
  - "Edit(tools/agentflow/**)"
  - "Read(.env*)"
  - "Bash(git *)"
  - "Bash(rm -rf*)"
